[package]
name = "nextcloud-rs"
version = "0.1.0"
edition = "2024"
description = "Async client for the Nextcloud server APIs: WebDAV files, OCS sharing, provisioning, capabilities, notifications and more"
license = "MIT"
repository = "https://github.com/Servus-Altissimi/nextcloud-rs"
keywords = ["nextcloud", "webdav", "ocs", "client", "cloud"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "nextcloud"

[dependencies]
bytes = "1.12"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.34"
httpdate = "1.0.3"
percent-encoding = "2.3"
quick-xml = "0.41"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
tracing = "0.1.44"
url = "2.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form", "query", "charset"] }
tokio = { version = "1.53", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "query", "charset"] }
gloo-timers = { version = "0.4", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true
